# Netlify baut die Seite bei jeder Änderung (auch aus Decap CMS) neu.
[build]
  command = "python _quelle/build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# Schriften und Bilder lange zwischenspeichern
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
